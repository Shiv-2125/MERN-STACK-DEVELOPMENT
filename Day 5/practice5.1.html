<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #63e009;
            color: #f15d01ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(111, 58, 235, 0.1);
            text-align: center;
            width: 400px;
        }
        .container h1 {
            color: #98089abe;
            margin-bottom: 20px;
        }
        .choices {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .choices button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .choices button:hover {
            background: #45a049;
        }
        .result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .result span {
            color: #fb136c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rock, Paper, Scissors</h1>
        <div class="choices">
            <button onclick="playGame('rock')">Rock</button>
            <button onclick="playGame('paper')">Paper</button>
            <button onclick="playGame('scissors')">Scissors</button>
        </div>
        <div class="result" id="result">Make your move!</div>
    </div>

    <script>
        function playGame(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];

            let resultMessage;

            // Determine winner
            if (playerChoice === computerChoice) {
                resultMessage = It's a tie! Both chose <span>${playerChoice}</span>.;
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                resultMessage = You win! You chose <span>${playerChoice}</span> and the computer chose <span>${computerChoice}</span>.;
            } else {
                resultMessage = You lose! You chose <span>${playerChoice}</span> and the computer chose <span>${computerChoice}</span>.;
            }

            // Display result
            document.getElementById('result').innerHTML = resultMessage;
        }
    </script>
</body>
</html>
