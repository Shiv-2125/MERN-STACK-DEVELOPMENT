##SIMPLE INTREST CALCLUATOR##
<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
</head>
<body>
    <h2>Simple Interest Calculator</h2>
    <form id="interestForm">
        <label for="principal">Principal (P):</label>
        <input type="number" id="principal" required><br><br>

        <label for="rate">Rate of Interest (R%):</label>
        <input type="number" id="rate" step="0.01" required><br><br>

        <label for="time">Time (T in years):</label>
        <input type="number" id="time" required><br><br>

        <button type="button" onclick="calculateInterest()">Calculate</button>
    </form>
    <h3 id="result"></h3>

    <script>
        function calculateInterest() {
            // Get input values
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const time = parseFloat(document.getElementById('time').value);

            // Check if inputs are valid
            if (!isNaN(principal) && !isNaN(rate) && !isNaN(time)) {
                // Calculate simple interest
                const interest = (principal * rate * time) / 100;

                // Display result
                document.getElementById('result').textContent = Simple Interest: ${interest.toFixed(2)};
            } else {
                document.getElementById('result').textContent = 'Please enter valid values.';
            }
        }
    </script>
</body>
</html>
