<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Weighing Machine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .machine {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 300px;
      height: 500px;
      text-align: center;
      padding: 20px;
    }
    .display {
      background: #333;
      color: #0f0;
      font-size: 2em;
      border-radius: 10px;
      padding: 10px;
      margin: 20px auto;
      width: 80%;
      text-align: center;
    }
    .button {
      background: #007bff;
      color: white;
      padding: 15px 30px;
      margin: 20px auto;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
    }
    .button:hover {
      background: #91df0b;
    }
    .person {
      margin-top: 20px;
    }
    .person img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="machine">
  <div class="display" id="weightDisplay">--.-- kg</div>
  <button class="button" id="weighButton">Weigh Me!</button>
  <div class="person">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlPGGkueYGQx-tjpCxDckoIWJNNgaBv9aFww&s" alt="Human placeholder" id="personImage">
  </div>
</div>

<script>
  const weightDisplay = document.getElementById('weightDisplay');
  const weighButton = document.getElementById('weighButton');

  // Generate a random weight
  function getRandomWeight() {
    return (Math.random() * (100 - 50) + 50).toFixed(1); // Random weight between 50 and 100 kg
  }

  // Handle button click
  weighButton.addEventListener('click', () => {
    const weight = getRandomWeight();
    weightDisplay.textContent = ${weight} kg;
  });
</script>

</body>
</html>
